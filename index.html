<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="player">
            <div class="player_header">
                <div class="player_btn player_btn--small">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <h5 class="player_title">Playing now</h5>
                <div class="player_btn player_btn--small">
                    <i class="fas fa-bars"></i>
                </div>
            </div>

            <div class="player_album">
                <img src="files/liniker.jpg" alt="Capa do album Liniker" class="player_image" id="albumArt">
            </div>

            <h2 class="player_artist" id="artistName">Liniker</h2>
            <h3 class="player_song" id="songName">Zero</h3>

            <div class="player_progress">
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
                <div class="audio-duration">
                    <span class="time-current" id="currentTime">0:00</span>
                    <span class="time-total" id="totalTime">0:00</span>
                </div>
            </div>

            <div class="player_skip">
                <button class="skip-btn" id="skipBack" aria-label="Voltar 10 segundos">
                    <i class="material-icons">replay_10</i>
                </button>
                <button class="skip-btn" id="skipForward" aria-label="Avancar 10 segundos">
                    <i class="material-icons">forward_10</i>
                </button>
            </div>

            <audio id="audio">
                <source src="files/liniker_zero.mp3" type="audio/mpeg">
            </audio>

            <div class="player_controls">
                <div class="player_btn player_btn--medium" id="prevBtn" aria-label="Anterior">
                    <i class="fas fa-backward"></i>
                </div>

                <div class="player_btn player_btn--large blu" id="playBtn" aria-label="Play/Pause">
                    <i class="fas fa-play play-icon"></i>
                    <i class="fas fa-pause pause-icon hide"></i>
                </div>

                <div class="player_btn player_btn--medium" id="nextBtn" aria-label="Proximo">
                    <i class="fas fa-forward"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>

</body>

</html>
